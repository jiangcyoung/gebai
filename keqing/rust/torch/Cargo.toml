[package]
name = "torch"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "torch"
path = "src/main.rs"

# PyTorch Profiler trace 分析的原生聚合后端：trace 为文本 JSON（GB 级常见），
# 在本机 RTX 4080 SUPER + Bun 1.3.14 上实测宿主 JS 路径约 32 MB/s（真实 torch 输出格式，
# 平均 350 字节/事件）——瓶颈是流式缓冲的逐块拼接与逐字符字符串索引。原生实现整文件读入
# （GB 级内存可接受，换来字节级扫描），不经过 JS 层。
#
# rayon：分块并行聚合——块内只算**可交换**的部分（计数/求和/min/max、分组统计、类别统计…），
# 顺序依赖部分（浅栈自身耗时、采样器蓄水池、时间线并集的 running-max、显存活跃集/TopK、
# flow 配对与全局活动、correlation 启发表）只记紧凑日志，归并阶段按全局序用与单趟路径**同一批
# helper** 回放——逐字段一致由「语义只有一份实现」保证，而不是靠近似。块起点由「结构摘要
# + 按块序合成」精确得到（猜起点会把嵌套对象当顶层元素，静默污染结果）。结构摘要用 SSE2
# 掩码跳纯文本段；非 gz 大文件另按分片并行读（I/O 并行度与核数解耦）。
# 实测（本机容器 cgroup 限 **4 核** CPU，宿主 64 逻辑核）：224 MB / 94 万事件 743ms→408ms
# （**1.82×**）、672 MB / 279 万事件 2175ms→1201ms（**1.81×**，多轮取 min）；2 线程 1.36×，
# 4 线程即饱和——剩余串行段是读文件、全局序回放（并集/分桶、启发表、采样器）与输出组装。
# 峰值 RSS 约 1.6× 文件大小（日志 24–48 B/事件）。开关 `TORCH_NATIVE_THREADS`（未设 = 自动：
# < 4 MB 单趟、否则可用核数；= 1 = 单趟直接路径，即改造前行为）。
#
# flate2：TensorBoard 默认产物为 *.pt.trace.json.gz，解压在原生侧完成（不落中间文件）。
[dependencies]
gebai-keqing-framework = { path = "../framework" }
flate2 = "1.0"
rayon = "1.12.0"
