[package]
name = "torch"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "torch"
path = "src/main.rs"

# PyTorch Profiler trace 分析的原生聚合后端：trace 为文本 JSON（GB 级常见），
# 在本机 RTX 4080 SUPER + Bun 1.3.14 上实测宿主 JS 路径约 32 MB/s（真实 torch 输出格式，
# 平均 350 字节/事件）——瓶颈是流式缓冲的逐块拼接与逐字符字符串索引。原生实现整文件读入
# （GB 级内存可接受，换来字节级扫描），不经过 JS 层。
#
# flate2：TensorBoard 默认产物为 *.pt.trace.json.gz，解压在原生侧完成（不落中间文件）。
[dependencies]
gebai-keqing-framework = { path = "../framework" }
flate2 = "1.0"
